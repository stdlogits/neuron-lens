[project]
name = "neuron-lens"
version = "0.1.0"
description = "A catalog of every MLP neuron and attention head of Qwen3-8B, read through two Jacobian lenses and from activations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }, { name = "treetowntree" }]
dependencies = [
    "datasets",
    "huggingface-hub",
    "numpy",
    "pyarrow",
    "safetensors",
    "torch",
    "transformers>=5",
]

[project.optional-dependencies]
# Lens loading and export to Drowse homes; fitting (02_fit.py) does not need it.
drowse = ["drowse.ai>=5.3.0"]
# Figures for docs/findings.md (scripts/11_figures.py).
plots = ["matplotlib"]
# Gemma 4's image and sound collections (neuron_lens/media_sets.py).
media = ["pillow", "scipy", "soundfile", "timm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuron_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
